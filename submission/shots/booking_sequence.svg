<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <rect width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3b3b40"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#0a7f44"/></marker>
  </defs>
  <!-- lanes -->
  <g font-weight="600" font-size="14" text-anchor="middle" fill="#0a0a0b">
    <rect x="40" y="16" width="160" height="38" rx="8" fill="#f5f5f6" stroke="#d0d0d4"/><text x="120" y="40">The person</text>
    <rect x="270" y="16" width="190" height="38" rx="8" fill="#e8f4ee" stroke="#9fd0b6"/><text x="365" y="40">Their agent (gateway)</text>
    <rect x="530" y="16" width="190" height="38" rx="8" fill="#e8f4ee" stroke="#9fd0b6"/><text x="625" y="40">Other players' agents</text>
    <rect x="790" y="16" width="130" height="38" rx="8" fill="#f5f5f6" stroke="#d0d0d4"/><text x="855" y="40">The court</text>
  </g>
  <g stroke="#c8c8cc" stroke-dasharray="4 4">
    <line x1="120" y1="54" x2="120" y2="545"/><line x1="365" y1="54" x2="365" y2="545"/>
    <line x1="625" y1="54" x2="625" y2="545"/><line x1="855" y1="54" x2="855" y2="545"/>
  </g>
  <g fill="#0a0a0b">
    <!-- 1 -->
    <line x1="120" y1="88" x2="361" y2="88" stroke="#3b3b40" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="130" y="80">1. "Doubles on Saturday", one sentence or a tap</text>
    <!-- 2 -->
    <rect x="300" y="100" width="130" height="44" rx="6" fill="#ffffff" stroke="#0a7f44"/>
    <text x="365" y="118" text-anchor="middle">Code: times, courts,</text>
    <text x="365" y="134" text-anchor="middle">trips, hard rules</text>
    <line x1="361" y1="160" x2="124" y2="160" stroke="#0a7f44" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="130" y="154" fill="#0a7f44" font-weight="600">2. The game's card: 7 ms</text>
    <!-- 3 -->
    <line x1="365" y1="196" x2="621" y2="196" stroke="#3b3b40" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="375" y="188">3. A2A proposal, facts only (signed)</text>
    <text x="375" y="212" fill="#65656c" font-size="12">+185 ms when the agent is on another machine</text>
    <!-- 4 -->
    <rect x="540" y="226" width="185" height="112" rx="6" fill="#ffffff" stroke="#0a7f44"/>
    <text x="625" y="246" text-anchor="middle" font-weight="600">4. Each agent answers</text>
    <text x="550" y="266">code first: ms</text>
    <text x="550" y="284">our 1B student: 0.9 s</text>
    <text x="550" y="302">one-pass decider: 0.53 s</text>
    <text x="550" y="320">Glimmer, if still open: ~40 s</text>
    <line x1="621" y1="356" x2="369" y2="356" stroke="#3b3b40" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="380" y="350">5. Yes, or one counter time; the time is held 30 min</text>
    <!-- 6 -->
    <line x1="361" y1="396" x2="124" y2="396" stroke="#3b3b40" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="130" y="388">6. "Thursday 19:00, 4 in. Book it?"</text>
    <text x="130" y="412" fill="#65656c" font-size="12">every wait shows a moving bar within 250 ms</text>
    <!-- 7 -->
    <line x1="120" y1="440" x2="361" y2="440" stroke="#0a7f44" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="130" y="432" fill="#0a7f44" font-weight="600">7. One yes</text>
    <!-- 8 -->
    <line x1="365" y1="476" x2="851" y2="476" stroke="#3b3b40" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="375" y="468">8. Book: the players' yeses checked, booked once only (idempotent)</text>
    <line x1="361" y1="516" x2="124" y2="516" stroke="#0a7f44" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="130" y="508" fill="#0a7f44" font-weight="600">9. "Booked", to every player</text>
  </g>
  <text x="40" y="552" fill="#65656c" font-size="11">Times as measured: the card on a local copy; the hop between two machines; the student on the server CPU; the decider and Glimmer on the RTX 3090.</text>
</svg>

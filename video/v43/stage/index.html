<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:"Segoe UI","Segoe UI Variable",system-ui,sans-serif;color:#0a0a0b}
#root{position:absolute;inset:0;overflow:hidden;background:#fff}
.abs{position:absolute}
.mono{font-family:"Cascadia Mono","Consolas",monospace}
.green{color:#0a7f44}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 20px;font-size:24px;font-weight:600}
.label{position:absolute;right:48px;top:40px;background:#0a0a0b;color:#fff;border-radius:12px;padding:12px 20px;font-size:24px;font-weight:600;letter-spacing:.2px;z-index:50}
.cut{position:absolute;right:48px;bottom:118px;color:#7a7f87;font-size:20px;font-weight:600;letter-spacing:1px;border:1.5px solid #c9ccd1;border-radius:8px;padding:4px 12px;z-index:50;background:#fff}
.simtag{position:absolute;left:48px;bottom:118px;color:#9a5b00;font-size:20px;font-weight:700;letter-spacing:1px;border:1.5px solid #f0c27a;background:#fff8ec;border-radius:8px;padding:4px 12px;z-index:50}
#sub{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);max-width:1560px;text-align:center;font-size:31px;line-height:1.3;font-weight:500;color:#111;background:rgba(255,255,255,.94);padding:8px 22px;border-radius:12px;z-index:60;box-shadow:0 0 0 1px rgba(0,0,0,.05)}
#progress{position:absolute;left:48px;top:44px;display:flex;gap:6px;z-index:50}
#progress div{font-size:17px;font-weight:600;padding:7px 12px;border-radius:999px;background:#f1f3f5;color:#9aa0a6;white-space:nowrap}
#progress div.on{background:#0a7f44;color:#fff}
#progress div.done{background:#dff1e7;color:#0a7f44}
.card{background:#fff;border:1.5px solid #e3e6ea;border-radius:24px;box-shadow:0 10px 30px rgba(10,20,30,.08)}
.phone{position:absolute;border:14px solid #111;border-radius:64px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.phone img.scr{position:absolute;left:0;top:0;width:100%;height:100%}
.h1{font-size:64px;font-weight:700;letter-spacing:-1px}
.h2{font-size:44px;font-weight:700;letter-spacing:-.5px}
.muted{color:#5f6368}
.chip{display:inline-block;padding:10px 18px;border-radius:999px;background:#eef7f1;color:#0a7f44;font-weight:600;font-size:26px;border:1.5px solid #bfe3cd}
.lock{width:64px;height:64px}
.tap{position:absolute;width:90px;height:90px;border-radius:50%;border:5px solid #0a7f44;transform:translate(-50%,-50%);z-index:20}
</style></head>
<body><div id="root"></div>
<script src="timings.js"></script>
<script src="basemap.js"></script>
<script src="courts_times.js"></script>
<script>
// ---- helpers ---------------------------------------------------------------------------------------------------
const R = document.getElementById('root');
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const ez = x => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2); // ease in-out
const eo = x => 1 - Math.pow(1 - x, 3); // ease out
const E = (t, a, b) => ez(seg(t, a, b));
const O = (t, a, b) => eo(seg(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
function el(tag, css = '', html = '', parent = R) {
  const e = document.createElement(tag);
  if (css) e.style.cssText = css;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const st = (e, o) => Object.assign(e.style, o);
// fade + rise in at time a (dur d), optional out at b
function show(e, t, a, d = .5, dy = 24, b = 1e9, bd = .4) {
  const k = O(t, a, a + d) * (1 - E(t, b, b + bd));
  e.style.opacity = k;
  e.style.transform = (e.dataset.base || '') + ` translateY(${(1 - O(t, a, a + d)) * dy}px)`;
  return k;
}
const L = 0.15; // the breath before each scene's narration
const SC = +new URLSearchParams(location.search).get('scene');
const CLEAN = new URLSearchParams(location.search).has('clean'); // a clip for the v3 frame: no captions, labels or progress line
const TT = CLEAN ? CLIPS[SC].subs : SC >= 1 && SC <= 16 ? TIMES[SC - 1] : [];
const s = i => L + (TT[i]?.start ?? 0); // when sentence i starts, in scene time
const DUR = CLEAN ? L + CLIPS[SC].dur + 0.6 : SC === 0 ? 2.0 : L + WAV[SC - 1] + (SC === 16 ? 2.2 : 0);
window.DUR = DUR;
// subtitles
const SUB = el('div', '', '', R); SUB.id = 'sub';
const CHUNKS = [];
TT.forEach(r => {
  const words = r.text.replace(/\s*\{\+[\d.]+\}$/, '').split(/(?<=[,;:—])\s*/);
  const parts = [];
  for (const w of words) {
    if (parts.length && (parts.at(-1) + ' ' + w).length <= 72) parts[parts.length - 1] += (/—$/.test(parts.at(-1)) ? '' : ' ') + w;
    else parts.push(w);
  }
  const total = parts.reduce((a, p) => a + p.length, 0);
  let at = r.start;
  parts.forEach(p => { const d = (r.end - r.start) * p.length / total; CHUNKS.push({text: p.trim(), start: at, end: at + d}); at += d; });
});
function subs(t) {
  const c = CHUNKS.find((r, i) => t >= L + r.start - .05 && t < L + (CHUNKS[i + 1] && CHUNKS[i + 1].start - r.end < .6 ? CHUNKS[i + 1].start - .05 : r.end + .3));
  const txt = c ? c.text : '';
  SUB.textContent = txt; SUB.style.display = txt && !CLEAN ? 'block' : 'none';
}
// the progress line of the walk-through
const STEPS = ['request', 'invite', 'court & reviews', 'agents agree', 'booked', 'proactive ask', 'after the game'];
function progress(at) {
  if (CLEAN) return;
  const p = el('div'); p.id = 'progress';
  STEPS.forEach((x, i) => el('div', '', x, p).className = i < at ? 'done' : i === at ? 'on' : '');
}
const label = txt => { const e = el('div', '', txt); e.className = 'label'; if (CLEAN) e.style.display = 'none'; return e; };
const cut = () => null; // (a promo: no cut notes on screen)
const simtag = () => ({style: {}}); // (a promo: no simulated tags on screen)
// a phone: the screenshot is 1170 x 2532; things placed on it use the screenshot's pixels
function phone(x, y, h) {
  const w = h * 1170 / 2532, f = h / 2532;
  const p = el('div', `left:${x}px;top:${y}px;width:${w + 28}px;height:${h + 28}px`);
  p.className = 'phone';
  const inner = el('div', `position:absolute;left:0;top:0;width:${w}px;height:${h}px;overflow:hidden`, '', p);
  const img = src => { const i = el('img', 'opacity:0', '', inner); i.src = src; i.className = 'scr'; return i; };
  const at = (css, html = '') => el('div', 'position:absolute;' + css, html, inner);
  return {p, inner, img, at, f, w, h};
}
const LOCK = '<svg viewBox="0 0 24 24" width="100%" height="100%"><rect x="4" y="10" width="16" height="11" rx="2.5" fill="#d93025"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#d93025" stroke-width="2.4"/><circle cx="12" cy="15.5" r="1.6" fill="#fff"/></svg>';
const CHECK = c => `<svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-.12em"><circle cx="12" cy="12" r="11" fill="${c || '#0a7f44'}"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const LOGO = (h = 40) => `<span style="display:inline-flex;align-items:center;gap:${h * .3}px;font-weight:600;font-size:${h}px;letter-spacing:-.5px"><svg viewBox="0 0 40 30" height="${h * .8}"><path d="M4 26 Q14 2 30 10" fill="none" stroke="#0a0a0b" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="13" r="3.4" fill="#0a7f44"/></svg>serve</span>`;
// crop of a picture (native size nw x nh) into a box, showing the native region x0,y0,x1,y1
function crop(e, src, nw, nh, x0, y0, x1, y1) {
  const bw = parseFloat(e.style.width), bh = parseFloat(e.style.height);
  const k = Math.max(bw / (x1 - x0), bh / (y1 - y0));
  st(e, {backgroundImage: `url(${src})`, backgroundSize: `${nw * k}px ${nh * k}px`,
    backgroundPosition: `${-(x0 + (x1 - x0) / 2) * k + bw / 2}px ${-(y0 + (y1 - y0) / 2) * k + bh / 2}px`});
}

// ---- the scenes ------------------------------------------------------------------------------------------------
const SCENES = {};

// 0: the deck's cover
SCENES[0] = () => {
  const i = el('img', 'position:absolute;inset:0;width:1920px;height:1080px'); i.src = 'cover.png';
  return t => { i.style.opacity = O(t, 0, .5); };
};

// 1: the problem
SCENES[1] = () => {
  const NW = 2237, NH = 1670;
  const box = el('div', `position:absolute;left:0;top:0;width:${NW}px;height:${NH}px;transform-origin:0 0`);
  const img = el('img', `position:absolute;inset:0;width:${NW}px;height:${NH}px`, '', box); img.src = 'pain_scene.png';
  const clouds = [[325, 246], [829, 246], [1333, 246], [1837, 246]];
  const locks = clouds.map(([x, y]) => el('div', `position:absolute;left:${x + 120}px;top:${y + 90}px;width:96px;height:96px;opacity:0`, LOCK, box));
  const lines = [];
  for (let i = 0; i < 3; i++) {
    const [x0] = clouds[i], [x1] = clouds[i + 1];
    const g = el('div', `position:absolute;left:${x0 + 210}px;top:${clouds[i][1] - 6}px;width:${x1 - x0 - 420}px;height:0;border-top:7px dashed #d93025;opacity:0`, '', box);
    const x = el('div', `position:absolute;left:${(x0 + x1) / 2 - 34}px;top:${clouds[i][1] - 44}px;width:68px;height:68px;opacity:0;font-size:76px;line-height:68px;text-align:center;color:#d93025;font-weight:800`, '×', box);
    lines.push([g, x]);
  }
  // the organiser's phone fills up
  const badge = el('div', 'position:absolute;left:700px;top:1100px;min-width:120px;height:96px;padding:0 26px;border-radius:48px;background:#d93025;color:#fff;font-size:56px;font-weight:800;line-height:96px;text-align:center;opacity:0', '', box);
  const card = el('div', 'position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:26px 44px;font-size:46px;font-weight:700;opacity:0;white-space:nowrap', '4 friends · 4 agents · <span style="color:#d93025">no place to talk</span>');
  card.className = 'card'; card.dataset.base = 'translateX(-50%)';
  const credit = el('div', 'position:absolute;left:48px;top:40px;font-size:20px;color:#9aa0a6;font-weight:600', 'illustration: Muse Image');
  // camera: [scale, focus x, focus y] in native pixels
  const cam = t => {
    const A = [1.05, 560, 1050], B = [0.645, NW / 2, NH / 2], C = [1.05, 1690, 1150];
    let k1 = E(t, 2.6, 4.4), k2 = E(t, 9.0, 11.2);
    const m = (i) => lerp(lerp(A[i], B[i], k1), C[i], k2);
    return [m(0), m(1), m(2)];
  };
  return t => {
    const [z, fx, fy] = cam(t);
    st(box, {transform: `translate(${960 - fx * z}px,${540 - fy * z}px) scale(${z})`});
    img.style.opacity = O(t, 0, .4);
    const n = Math.floor(lerp(3, 48, E(t, .4, 3.2)));
    badge.textContent = `+${n}`; badge.style.opacity = O(t, .4, .7) * (1 - E(t, 3.4, 3.9));
    locks.forEach((e, i) => { const k = O(t, 4.4 + i * .35, 4.8 + i * .35); e.style.opacity = k; e.style.transform = `scale(${.4 + .6 * k})`; });
    lines.forEach(([g, x], i) => { g.style.opacity = O(t, 5.6 + i * .25, 6.0 + i * .25); x.style.opacity = O(t, 5.9 + i * .25, 6.2 + i * .25); });
    show(card, t, 6.6, .5, 24, 8.9, .4);
    credit.style.opacity = 1;
  };
};

// 2: who it is for
SCENES[2] = () => {
  const head = el('div', 'position:absolute;left:0;right:0;top:120px;text-align:center', '<div class="h1">Who Serve is for</div>');
  const items = [
    ['Casual players &amp; organizers', 'People who want to play every week, but always end up organizing.', [380, 760, 1000, 1290]],
    ['Clubs', 'Clubs that need to fill courts and spots, week after week.', [1120, 560, 2180, 1300]],
    ['Agent builders', 'Developers whose personal agents need a place to talk to other agents.', [140, 70, 520, 430]],
  ];
  const cards = items.map(([h, p, c], i) => {
    const e = el('div', `position:absolute;left:${150 + i * 560}px;top:300px;width:500px;height:560px;padding:36px;opacity:0`);
    e.className = 'card';
    const pic = el('div', 'width:428px;height:260px;border-radius:18px;background-color:#f6f2ea', '', e);
    crop(pic, 'pain_scene.png', 2237, 1670, ...c);
    el('div', 'font-size:36px;font-weight:700;margin-top:28px;line-height:1.15', h, e);
    el('div', 'font-size:27px;color:#5f6368;margin-top:14px;line-height:1.35', p, e);
    return e;
  });
  const at = [s(1) + .55, s(1) + 2.65, s(1) + 4.75];
  return t => {
    show(head, t, 0, .5);
    cards.forEach((e, i) => { show(e, t, at[i], .55, 40); e.style.borderColor = t > at[i] && t < (at[i + 1] || 99) ? '#0a7f44' : '#e3e6ea'; });
  };
};

// 3: one sentence: Serve
SCENES[3] = () => {
  const NW = 1920, NH = 1280, k = 1080 / NH, hw = NW / 2 * k; // each half shown 810 x 1080
  const x0 = 120;
  const before = el('div', `position:absolute;left:${x0}px;top:0;width:${hw}px;height:1080px`);
  crop(before, 'pain_before_after.png', NW, NH, 0, 0, 960, 1280);
  const afterBox = el('div', `position:absolute;left:${x0}px;top:0;width:0px;height:1080px;overflow:hidden`);
  const after = el('div', `position:absolute;left:0;top:0;width:${hw}px;height:1080px`, '', afterBox);
  crop(after, 'pain_before_after.png', NW, NH, 960, 0, 1920, 1280);
  const line = el('div', `position:absolute;top:60px;height:960px;width:0;border-left:8px dashed #0a7f44;left:${x0}px`);
  const txt = el('div', 'position:absolute;left:1030px;top:250px;width:800px;opacity:0',
    `${LOGO(92)}<div style="font-size:58px;font-weight:700;letter-spacing:-1px;margin-top:34px;line-height:1.1">A self-evolving<br>agent platform</div>
     <div style="font-size:32px;color:#5f6368;margin-top:30px;line-height:1.4">Your agent works out the time, the court and the players with everyone else's agents.</div>
     <div id="yes" style="margin-top:36px;display:inline-block;padding:18px 34px;border-radius:999px;background:#0a0a0b;color:#fff;font-size:34px;font-weight:700;opacity:0">You say one yes.</div>`);
  const yes = txt.querySelector('#yes');
  return t => {
    const k1 = E(t, .6, 2.6);
    st(afterBox, {width: `${hw * k1}px`});
    st(line, {left: `${x0 + hw * k1}px`, opacity: k1 > 0 && k1 < 1 ? 1 : 0});
    before.style.opacity = O(t, 0, .4);
    show(txt, t, s(1) - .2, .6, 30);
    yes.style.opacity = O(t, s(1) + 4.3, s(1) + 4.8);
  };
};

// 4: one sentence becomes an invite (real screens from the local copy)
SCENES[4] = () => {
  progress(0);
  label('serve reads the day and intent in 7 ms · no model');
  const P = phone(240, 110, 860);
  const a1 = P.img('a1_messages.png'), a3 = P.img('a3_draft.png');
  const f = P.f;
  const typed = P.at(`left:${52 * f}px;top:${1960 * f}px;width:${905 * f}px;height:${125 * f}px;background:#fff;border:${3 * f}px solid #3b6fd8;border-radius:${30 * f}px;font-size:${44 * f}px;line-height:${119 * f}px;padding-left:${40 * f}px;white-space:nowrap;overflow:hidden;opacity:0`);
  const glow = P.at(`left:${91 * f}px;top:${777 * f}px;width:${830 * f}px;height:${557 * f}px;border:${8 * f}px solid #0a7f44;border-radius:${40 * f}px;opacity:0`);
  const say = el('div', 'position:absolute;left:820px;top:250px;font-size:54px;font-weight:700;letter-spacing:-.5px;opacity:0', '“Badminton Tuesday evening, need 1”');
  const chips = [['sport', 'badminton'], ['day', 'Tue 3 Nov'], ['time', 'evening → 18:00'], ['players', '1 more']].map(([k, v], i) =>
    el('div', `position:absolute;left:${820 + (i % 2) * 470}px;top:${420 + Math.floor(i / 2) * 150}px;opacity:0`, `<div style="font-size:22px;color:#5f6368;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">${k}</div><span class="chip" style="font-size:34px">${v}</span>`));
  const ms = el('div', 'position:absolute;left:820px;top:760px;font-size:30px;color:#5f6368;opacity:0', 'Read by code in <b style="color:#0a7f44">7 ms</b> (median, local copy). No model call.');
  const TXT = 'Badminton Tuesday evening, need 1';
  return t => {
    a1.style.opacity = 1 - E(t, 1.95, 2.25); a3.style.opacity = E(t, 1.95, 2.25);
    const n = Math.round(TXT.length * seg(t, .25, 1.6));
    typed.textContent = TXT.slice(0, n) + (t < 1.9 && Math.floor(t * 3) % 2 ? '|' : '');
    typed.style.opacity = t < 1.95 ? 1 : 0;
    glow.style.opacity = O(t, 2.3, 2.6) * (.55 + .45 * Math.sin(t * 6));
    show(say, t, .3, .5);
    chips.forEach((c, i) => show(c, t, 2.0 + i * .22, .4, 18));
    show(ms, t, 3.1, .4);
  };
};

// 5: posting, checked first (real screens; the check's wait is cut)
SCENES[5] = () => {
  progress(1);
  label('Llama Guard 3 · Prompt Guard 2 · before anyone sees it');
  cut();
  const P = phone(240, 110, 860), f = P.f;
  const a3 = P.img('a3_draft.png'), a4 = P.img('a4_posted.png');
  const tap = P.at(`left:${237 * f}px;top:${1248 * f}px;width:${120 * f}px;height:${120 * f}px;border-radius:50%;border:${8 * f}px solid #0a7f44;transform:translate(-50%,-50%);opacity:0`);
  const badge = P.at(`left:${48 * f}px;top:${1150 * f}px;padding:${14 * f}px ${26 * f}px;border-radius:${40 * f}px;background:#dff1e7;color:#0a7f44;font-size:${36 * f}px;font-weight:700;white-space:nowrap;opacity:0`, `${CHECK()} checked: Llama Guard 3 · Prompt Guard 2`);
  const share = P.at(`left:${400 * f}px;top:${1040 * f}px;width:${290 * f}px;height:${108 * f}px;border-radius:${60 * f}px;border:${7 * f}px solid #0a7f44;opacity:0`);
  const rows = [['Llama Guard 3', 'safe · no harmful content'], ['Prompt Guard 2', 'no prompt injection']].map(([a, b], i) => {
    const e = el('div', `position:absolute;left:820px;top:${300 + i * 190}px;width:900px;padding:30px 36px;opacity:0;display:flex;align-items:center;gap:28px`);
    e.className = 'card';
    e.innerHTML = `<div style="font-size:64px">${CHECK()}</div><div><div style="font-size:40px;font-weight:700">${a}</div><div style="font-size:28px;color:#5f6368;margin-top:4px">${b}</div></div>`;
    return e;
  });
  const after = el('div', 'position:absolute;left:820px;top:700px;font-size:32px;color:#5f6368;opacity:0', 'Then the invite goes out, with a link to share.');
  return t => {
    const k = E(t, .9, 1.2);
    a3.style.opacity = 1 - k; a4.style.opacity = k;
    tap.style.opacity = seg(t, .45, .6) * (1 - seg(t, .8, .95)); tap.style.transform = `translate(-50%,-50%) scale(${.6 + seg(t, .45, .95)})`;
    badge.style.opacity = O(t, 1.3, 1.6);
    share.style.opacity = O(t, 2.9, 3.2) * (.5 + .5 * Math.sin(t * 7));
    rows.forEach((r, i) => show(r, t, .2 + i * .35, .45));
    show(after, t, 2.6, .4);
  };
};

// 6: the best court: map, weather, reviews, travel (real places and forecast; the reviews are simulated)
SCENES[6] = () => {
  progress(2);
  label('Muse Glimmer judges courts · Prompt Guard 2 screens reviews');
  cut();
  const M = BASEMAP, mw = 980, k = 1.9 * mw / M.w, mh = M.h * k;
  const map = el('div', `position:absolute;left:880px;top:118px;width:${mw}px;height:${Math.min(mh, 830)}px;border-radius:24px;overflow:hidden;border:1.5px solid #e3e6ea;background:#f4f3ef`);
  const cx = 467, cy = 360, oy = -(cy * k - 430), ox = -(cx * k - 520);
  const svg = el('div', `position:absolute;left:${ox}px;top:${oy}px;width:${M.w * k}px;height:${mh}px`, `<svg viewBox="0 0 ${M.w} ${M.h}" width="${M.w * k}" height="${mh}">
    <path d="${M.green}" fill="#dcebd5"/><path d="${M.water}" fill="#cfe1f0"/><path d="${M.rivers}" fill="none" stroke="#cfe1f0" stroke-width="9"/>
    <path d="${M.minor}" fill="none" stroke="#fff" stroke-width="1.2"/><path d="${M.major}" fill="none" stroke="#fff" stroke-width="3"/>
    <path id="r1" d="M${M.pts.mia} L${M.pts.ntu}" fill="none" stroke="#0a0a0b" stroke-width="3" stroke-linecap="round"/>
    <path id="r2" d="M${M.pts.leo} Q${(M.pts.leo[0] + M.pts.ntu[0]) / 2 - 60},${(M.pts.leo[1] + M.pts.ntu[1]) / 2} ${M.pts.ntu}" fill="none" stroke="#1a73e8" stroke-width="3" stroke-linecap="round"/>
  </svg>`, map);
  const r1 = svg.querySelector('#r1'), r2 = svg.querySelector('#r2');

  if (!window.VIDEO) return ok();
  const v = window.VIDEO, to = window.VT(t);
  if (Math.abs(v.currentTime - to) < 1e-3 && v.readyState >= 2) return ok();
  v.addEventListener('seeked', () => requestAnimationFrame(() => ok()), {once: true});
  v.currentTime = to;
});
window.ready = () => new Promise(ok => {
  const imgs = [...document.images].filter(i => !i.complete);
  const vids = window.VIDEO ? [new Promise(r => window.VIDEO.readyState >= 2 ? r() : window.VIDEO.addEventListener('loadeddata', r, {once: true}))] : [];
  Promise.all([...imgs.map(i => new Promise(r => { i.onload = i.onerror = r; })), ...vids, document.fonts.ready]).then(ok);
});
